name: Reportar una ficha o enlace del catálogo
description: Informar referencias vencidas, precios incorrectos o enlaces que no funcionan.
title: "[Catálogo] "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Gracias por informar un problema. **No incluyas RUT, teléfonos, direcciones particulares, documentación ni otros datos sensibles.**
        La notificación no certifica que una propiedad esté o deje de estar disponible.
  - type: input
    id: identificador
    attributes:
      label: Identificador de la publicación
      description: Código IEC-PUB-... que se muestra en el catálogo.
      placeholder: IEC-PUB-2026-000001
    validations:
      required: true
  - type: dropdown
    id: tipo
    attributes:
      label: Tipo de incidencia
      options:
        - La publicación ya no existe
        - Enlace roto o incorrecto
        - Precio aparentemente desactualizado
        - Imagen o información que induce a confusión
        - Otra corrección de contenido
    validations:
      required: true
  - type: textarea
    id: detalle
    attributes:
      label: Descripción
      description: Explica el error usando solo información pública.
      placeholder: La página original muestra un aviso de publicación finalizada.
    validations:
      required: true
  - type: input
    id: fuente
    attributes:
      label: Página pública de referencia
      description: URL pública donde puede verificarse la información.
      placeholder: https://...
    validations:
      required: false
