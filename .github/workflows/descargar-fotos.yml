name: Publicar fotos referenciales optimizadas
on:
  push:
    paths:
      - .github/workflows/descargar-fotos.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fotos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Obtener fotografías autorizadas bajo licencia Unsplash
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/photos
          curl --fail --location --retry 3 --max-time 45 --silent --show-error "https://images.unsplash.com/photo-1758448511487-15f69dd6107b?auto=format&fit=crop&w=960&q=72&fm=jpg" --output "assets/photos/nueva-maipu.jpg"
          curl --fail --location --retry 3 --max-time 45 --silent --show-error "https://images.unsplash.com/photo-1774979517612-db480ae5b587?auto=format&fit=crop&w=960&q=72&fm=jpg" --output "assets/photos/cipreses.jpg"
          curl --fail --location --retry 3 --max-time 45 --silent --show-error "https://images.unsplash.com/photo-1766603636700-e9d80473f40f?auto=format&fit=crop&w=960&q=72&fm=jpg" --output "assets/photos/costa-san-pedro.jpg"
          curl --fail --location --retry 3 --max-time 45 --silent --show-error "https://images.unsplash.com/photo-1767843834787-6c3029050b18?auto=format&fit=crop&w=960&q=72&fm=jpg" --output "assets/photos/bcome.jpg"
          curl --fail --location --retry 3 --max-time 45 --silent --show-error "https://images.unsplash.com/photo-1516069429726-51d80d545cbf?auto=format&fit=crop&w=960&q=72&fm=jpg" --output "assets/photos/tres-pascualas.jpg"
          curl --fail --location --retry 3 --max-time 45 --silent --show-error "https://images.unsplash.com/photo-1768162485696-b67b380571a4?auto=format&fit=crop&w=960&q=72&fm=jpg" --output "assets/photos/mirador-oceanico.jpg"
          # Fotografía editorial de portada, separada de las fichas de inmuebles.
          curl --fail --location --retry 3 --max-time 45 --silent --show-error "https://images.unsplash.com/photo-1776222075410-5acc108845c8?auto=format&fit=crop&w=1850&q=80&fm=webp" --output "assets/photos/hero-editorial.webp"
          curl --fail --location --retry 3 --max-time 45 --silent --show-error "https://images.unsplash.com/photo-1776222075410-5acc108845c8?auto=format&fit=crop&w=840&q=76&fm=webp" --output "assets/photos/hero-editorial-mobile.webp"
          file assets/photos/*.jpg assets/photos/*.webp
          test "$(wc -c < assets/photos/hero-editorial.webp)" -gt 12000
          test "$(wc -c < assets/photos/hero-editorial-mobile.webp)" -gt 8000
      - name: Publicar fotografías dentro del repositorio
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/photos
          if ! git diff --cached --quiet; then
            git commit -m "assets: guardar fotografías referenciales locales"
            git push
          fi
