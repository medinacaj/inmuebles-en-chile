name: QA visual responsivo
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'assets/css/**'
      - 'assets/illustrations/**'
      - 'assets/photos/**'
      - 'data/**'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/resilience-check.mjs'
      - 'scripts/accessibility-check.mjs'
      - 'scripts/autoplay-check.mjs'
      - 'herramientas.html'
      - 'guia.html'
      - 'informacion.html'
      - 'scripts/visual-check.mjs'
      - 'scripts/compatibility-check.mjs'
      - '.github/workflows/qa-responsive.yml'
permissions:
  contents: read
concurrency:
  group: qa-responsive
  cancel-in-progress: true
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Instalar navegador para pruebas (solo CI)
        run: |
          npm ci
          npx playwright install --with-deps chromium firefox webkit
      - name: Servir sitio localmente
        run: python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/inmuebles-site.log 2>&1 &
      - name: Probar navegación y desbordamientos en 12 escenarios
        run: |
          mkdir -p test-results
          node scripts/visual-check.mjs > test-results/visual.json
      - name: Probar errores de red, filtros e historial
        run: node scripts/resilience-check.mjs > test-results/resilience.json
      - name: Probar reproducción automática del carrusel
        run: node scripts/autoplay-check.mjs > test-results/autoplay.json
      - name: Comprobar accesibilidad automatizada
        run: node scripts/accessibility-check.mjs > test-results/accessibility.json
      - name: Probar compatibilidad Firefox y motor WebKit
        run: node scripts/compatibility-check.mjs > test-results/compatibility.json
      - name: Conservar resultados de QA
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: qa-browser
          path: test-results/
          if-no-files-found: ignore
          retention-days: 14
