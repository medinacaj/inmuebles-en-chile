name: Calidad del sitio
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Pruebas de integridad y lógica
        run: node --test scripts/tests.mjs
      - name: Probar recolector RSS sin conexión externa
        run: python3 -m unittest discover -s scripts -p 'test_news.py' -v
