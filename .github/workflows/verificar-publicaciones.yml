name: Revisar vigencia de publicaciones
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'scripts/check-listings.mjs'
      - 'scripts/audit-status.mjs'
  schedule:
    - cron: '23 11 * * *'
permissions:
  contents: write
concurrency:
  group: listing-status
  cancel-in-progress: false
jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Revisar fichas y publicar resultados sobre la última versión
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for intento in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            node scripts/check-listings.mjs
            node scripts/audit-status.mjs
            git add data/listing-status.json
            if git diff --cached --quiet; then
              echo "Estado sin cambios"
              exit 0
            fi
            git commit -m "chore: actualizar estado de fichas inmobiliarias"
            if git push origin HEAD:main; then
              echo "Resultados publicados"
              exit 0
            fi
            echo "La rama cambió durante la revisión: reintentando"
            sleep 2
          done
          echo "No fue posible publicar la verificación tras cinco intentos"
          exit 1
